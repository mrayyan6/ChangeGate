ticket:
  id: CHG-2006
  title: Internal access to PostgreSQL
  body: The platform team needs to reach PostgreSQL on the db tier from the internal network.
timestamp: '2026-10-17T02:30:00Z'
request: Open port 5432 (PostgreSQL) on the db security group from 10.60.0.0/16 so the platform team can connect.
violated_controls: []
assertions:
- type: sg_ingress
  sg: aws_security_group.db
  port: 5432
  cidr: 10.60.0.0/16
  present: true
- type: sg_ingress
  sg: '*'
  port: 5432
  cidr: 0.0.0.0/0
  present: false
oracle:
  edits:
  - path: security_groups.tf
    old: '  tags = merge(local.common_tags, { Name = "${local.name_prefix}-db", criticality = "high" })'
    new: |2-
        ingress {
          description = "PostgreSQL from the internal range"
          from_port   = 5432
          to_port     = 5432
          protocol    = "tcp"
          cidr_blocks = ["10.60.0.0/16"]
        }

        tags = merge(local.common_tags, { Name = "${local.name_prefix}-db", criticality = "high" })
