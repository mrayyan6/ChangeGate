[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changegate"
version = "0.1.0"
description = "Deterministic policy-as-code guardrails for LLM agents that change infrastructure-as-code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Rayyan" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "python-hcl2>=4.3",
  "requests>=2.31",
  "matplotlib>=3.8",
  "langchain>=0.3.25,<0.4",
  "langchain-core>=0.3.60,<0.4",
  "langchain-ollama>=0.3,<0.4",
  "langchain-google-genai>=2.1,<3",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
agentspec = ["antlr4-python3-runtime==4.13.2"]
dev = ["pytest>=8.0"]

[project.scripts]
changegate = "changegate.cli:app"

[tool.setuptools.packages.find]
include = ["changegate*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: runs real terraform, opa or trivy binaries",
]
